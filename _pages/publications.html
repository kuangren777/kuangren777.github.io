function vals(lang){
  const zh = lang==='zh';
  const t = zh ? {

    role1:'复旦大学 · 博士生', role2:'香港科技大学 · 访问学生', location:'中国 · 上海', org:'复旦大学',
    email:'电子邮件', cv:'下载简历', updated:'最近更新', navHome:'主页', navPubs:'论文',
    kicker:'研究成果 · 同行评审与预印本', heading:'论文发表',
    statPapers:'论文', statVenues:'发表渠道', statSpan:'时间跨度',
    scholarTitle:'查看完整引用与指标', scholarDesc:'最新的论文与引用数据请见 Google Scholar。',
  } : {
    statusA:'AVAILABLE', statusB:'OPEN TO COLLAB', name:'骆明宇', nameAlt:'MINGYU LUO',
    role1:'Ph.D. Student · Fudan University', role2:'Visiting Student · HKUST', location:'Shanghai, China', org:'Fudan University',
    email:'Email', cv:'Download CV', updated:'LAST UPDATED', navHome:'Home', navPubs:'Publications',
    kicker:'RESEARCH OUTPUT · PEER-REVIEWED & PREPRINTS', heading:'Publications',
    statPapers:'Papers', statVenues:'Venues', statSpan:'Span',
    scholarTitle:'Full citation metrics', scholarDesc:'See the latest papers and citation counts on Google Scholar.',
  };
  const rawPubs = [
    { year:'2025', link:'https://my.drluo.cn/publication/2026-05-01-tipexploit', venue:'Preprint', type:'arXiv:2509.05755', accept:false, linkLabel:'arXiv',
      title: zh ? 'Red-Teaming Coding Agents：从工具调用视角的实证安全评估' : 'Red-Teaming Coding Agents from a Tool-Invocation Perspective: An Empirical Security Assessment',
      authors:'Yuchong Xie, Mingyu Luo, Zesen Liu, et al.',
      cite:'On the Security of Tool-Invocation Prompts for LLM-Based Agentic Systems: An Empirical Risk Assessment. arXiv preprint arXiv:2509.05755, 2025.' },
    { year:'2025', link:'https://my.drluo.cn/publication/2025-11-04-revprag', venue:'EMNLP 2025', type:'Findings', accept:true, linkLabel:'ACL Anthology',
      title:'RevPRAG: Revealing Poisoning Attacks in Retrieval-Augmented Generation through LLM Activation Analysis',
      authors:'Xue Tan, Hao Luan, Mingyu Luo, Xiaoyan Sun, Ping Chen, Jun Dai',
      cite:'In Findings of the Association for Computational Linguistics: EMNLP 2025, pages 12999–13011, Suzhou, China.' },
    { year:'2025', link:'https://my.drluo.cn/publication/2025-10-27-queryipi', venue:'Preprint', type:'arXiv:2510.23675', accept:false, linkLabel:'arXiv',
      title:'QueryIPI: Query-agnostic Indirect Prompt Injection on Coding Agents',
      authors:'Yuchong Xie, Zesen Liu, Mingyu Luo, Zhixiang Zhang, Kaikai Zhang, Zongjie Li, Ping Chen, Shuai Wang, Dongdong She',
      cite:'"QueryIPI: Query-agnostic Indirect Prompt Injection on Coding Agents." arXiv preprint arXiv:2510.23675, 2025.' },
    { year:'2023', link:'https://my.drluo.cn/publication/2023-11-24-mscdn', venue:'Int. J. Intelligent Networks', type:'Journal', accept:true, linkLabel:'ScienceDirect',
      title:'Multi-sensor based strategy learning with deep reinforcement learning for unmanned ground vehicle',
      authors:'Mingyu Luo',
      cite:'International Journal of Intelligent Networks 4 (2023): 325-336.' },
  ];
  let counter = 0;
  const years = [...new Set(rawPubs.map(p=>p.year))];
  const groups = years.map(y=>{
    const items = rawPubs.filter(p=>p.year===y).map(p=>{
      counter += 1;
      return { idx:String(counter).padStart(2,'0'), link:p.link, venue:p.venue, type:p.type, title:p.title,
        cite:p.cite, linkLabel:p.linkLabel, accentTag:p.accept, authors:emph(p.authors) };
    });
    return { year:y, count: zh ? (items.length+' 篇') : (items.length+(items.length>1?' papers':' paper')), items };
  });
  return { t, groups, stats:{ total:String(rawPubs.length).padStart(2,'0'), venues:'04', span:"'23–'25" } };
}
function emph(str){
  const tokens=["Mingyu Luo","Luo, Mingyu","Luo M","Luo"]; const parts=[]; let i=0;
  while(i<str.length){ let hit=null,at=-1;
    for(const tk of tokens){ const idx=str.indexOf(tk,i); if(idx!==-1&&(at===-1||idx<at)){at=idx;hit=tk;} }
    if(at===-1){ parts.push({text:str.slice(i),isMe:false}); break; }
    if(at>i) parts.push({text:str.slice(i,at),isMe:false});
    parts.push({text:hit,isMe:true}); i=at+hit.length; }
  return parts;
}

function render(lang){
