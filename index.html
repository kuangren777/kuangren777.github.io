        { hk:'abstract', p:'The Bring-Your-Own-Key (BYOK) paradigm lets users route LLM traffic through third-party relay services while authenticating with their own credentials. We identify a fundamental security gap we call **post-alignment tampering**: an adversarial relay can rewrite the LLM’s aligned response **after** generation but **before** agent execution — and no existing application-layer mechanism can detect the substitution. We prove that post-alignment tampering strictly **dominates any prompt injection**: even a perfectly aligned LLM offers zero protection against a relay adversary. We instantiate it as the **Relay Tampering Attack (RTA)**, and across AgentDojo and ASB with six LLMs it reaches up to **99.1% attack success**, far outpacing prompt-injection baselines at modest overhead.' },
        { hk:'motivation', ul:[

    <section style="padding:48px 0 26px;"><div style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;">${esc(t.pubsKicker)}</div><h2 style="margin:16px 0 0;font-size:40px;line-height:1.06;font-weight:600;letter-spacing:-.025em;">${esc(t.pubsHeading)}</h2>
      <div style="display:flex;gap:36px;margin-top:26px;"><div><div style="font-family:'JetBrains Mono',monospace;font-size:30px;color:var(--accent);font-weight:600;">05</div><div style="font-size:12px;color:var(--t2);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;">${esc(t.statPapers)}</div></div><div style="width:1px;background:var(--line);"></div><div><div style="font-family:'JetBrains Mono',monospace;font-size:30px;color:var(--t1);font-weight:600;">04</div><div style="font-size:12px;color:var(--t2);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;">${esc(t.statVenues)}</div></div><div style="width:1px;background:var(--line);"></div><div><div style="font-family:'JetBrains Mono',monospace;font-size:30px;color:var(--t1);font-weight:600;">'23–'26</div><div style="font-size:12px;color:var(--t2);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;">${esc(t.statSpan)}</div></div></div>
    </section>${groups}
    <div style="margin-top:40px;padding:28px 30px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;"><div><div style="font-size:16px;font-weight:600;">${esc(t.scholarTitle)}</div><div style="font-size:13.5px;color:var(--t2);margin-top:5px;">${esc(t.scholarDesc)}</div></div><a class="scholarbtn" href="https://scholar.google.com/citations?user=KU8R00YAAAAJ" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:9px;padding:12px 20px;border:1px solid var(--accent);border-radius:10px;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;white-space:nowrap;">Google Scholar<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg></a></div>
  </div>`;
}
function viewDetail(D){
  const t=D.t; const raw = D.PAPERS.find(p=>p.id===st.pubId) || D.PAPERS[0];
  const venueTag = raw.accept?`<span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--accent);background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);padding:4px 11px;border-radius:6px;">${esc(raw.venue)}</span>`:`<span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--t2);border:1px solid var(--line);padding:4px 11px;border-radius:6px;">${esc(raw.venue)}</span>`;
  const body = (raw.body||[]).map(seg=>{ let h='';
    if(seg.hk) h+=`<div style="display:flex;align-items:center;gap:16px;margin:30px 0 16px;"><h3 style="margin:0;font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);">${esc(D.SECT[seg.hk])}</h3><div style="flex:1;height:1px;background:var(--line);"></div></div>`;
    if(seg.p) h+=`<p style="margin:0 0 14px;font-size:15.5px;line-height:1.78;color:var(--t1);">${richHTML(rich(seg.p))}</p>`;
    if(seg.ul) h+=`<div style="display:flex;flex-direction:column;gap:12px;margin:2px 0 18px;">`+seg.ul.map(s=>`<div style="display:grid;grid-template-columns:18px 1fr;gap:11px;font-size:14.5px;line-height:1.68;color:var(--t2);"><span style="color:var(--accent);padding-top:2px;font-family:'JetBrains Mono',monospace;font-size:12px;">▹</span><div>${richHTML(rich(s))}</div></div>`).join('')+`</div>`;
    if(seg.fig) h+=`<figure style="margin:10px 0 22px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code-bg);"><img src="${seg.fig.src}" alt="${esc(seg.fig.caption)}" loading="lazy" style="display:block;width:100%;height:auto;"/><figcaption style="padding:11px 16px;font-size:12.5px;color:var(--t3);border-top:1px solid var(--line);line-height:1.5;font-style:italic;">${esc(seg.fig.caption)}</figcaption></figure>`;
    return h; }).join('');
  const resources = raw.links.map(ln=>`<a class="reslink" href="${ln.href}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border:1px solid var(--line);border-radius:10px;color:var(--t1);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.05em;background:var(--surface);">${esc(ln.label)}<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg></a>`).join('');
  const cl = copied?(D.t.navHome==='主页'?'已复制':'Copied'):(lang==='zh'?'复制':'Copy');
  const cc = copied?'var(--accent)':'var(--t2)'; const cbd = copied?'var(--accent)':'var(--line)';
  return `<div style="animation:viewIn .35s ease both;">
    <section style="padding:40px 0 0;"><a class="backlnk" href="#publications" style="display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.08em;color:var(--t2);text-transform:uppercase;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>${esc(t.back)}</a>
      <div style="display:flex;align-items:center;gap:10px;margin:26px 0 18px;flex-wrap:wrap;">${venueTag}<span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3);letter-spacing:.04em;">${esc(raw.date)}</span></div>
      <h1 style="margin:0;font-size:33px;line-height:1.2;font-weight:600;letter-spacing:-.02em;color:var(--t1);">${esc(raw.title)}</h1>
      <div style="font-size:15px;color:var(--t2);margin-top:18px;line-height:1.6;">${authorsHTML(raw.authors)}</div>
      <div style="font-size:13.5px;color:var(--t3);margin-top:10px;line-height:1.5;font-style:italic;">${esc(raw.venueFull)}</div></section>
    <section style="padding:14px 0 0;">${body}</section>
    <section style="padding:30px 0 0;"><div style="display:flex;align-items:center;gap:16px;margin-bottom:18px;"><h3 style="margin:0;font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--t2);">${esc(t.secResources)}</h3><div style="flex:1;height:1px;background:var(--line);"></div></div><div style="display:flex;gap:12px;flex-wrap:wrap;">${resources}</div></section>
    <section style="padding:30px 0 0;"><div style="display:flex;align-items:center;gap:16px;margin-bottom:18px;"><h3 style="margin:0;font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--t2);">${esc(t.secCitation)}</h3><div style="flex:1;height:1px;background:var(--line);"></div></div><div style="border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:10px;padding:20px 22px;background:var(--surface);font-size:14.5px;line-height:1.7;color:var(--t1);">${esc(raw.citation)}</div></section>
    <section style="padding:30px 0 0;"><div style="display:flex;align-items:center;gap:16px;margin-bottom:18px;"><h3 style="margin:0;font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--t2);">BibTeX</h3><div style="flex:1;height:1px;background:var(--line);"></div><button id="copyBtn" style="display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid ${cbd};border-radius:8px;background:transparent;cursor:pointer;color:${cc};font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>${cl}</button></div><pre style="margin:0;border:1px solid var(--line);border-radius:10px;padding:20px 22px;background:var(--code-bg);overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--t2);white-space:pre;">${esc(raw.bibtex)}</pre></section>
  </div>`;
}
function topbar(D){
  const t=D.t; const on='var(--on)';
  const homeActive = st.route==='home', pubsActive = st.route==='pubs'||st.route==='detail';
  const enBg = lang==='zh'?'transparent':'var(--accent)', enColor = lang==='zh'?'var(--t2)':on;
  const zhBg = lang==='zh'?'var(--accent)':'transparent', zhColor = lang==='zh'?on:'var(--t2)';
  const themeIcon = theme==='light'
    ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`
    : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  return `<div id="pg-topbar" style="position:sticky;top:0;z-index:4;border-bottom:1px solid var(--line);background:var(--chrome);backdrop-filter:blur(10px);">
    <div id="pg-topbar-inner" style="max-width:900px;margin:0 auto;padding:0 44px;height:57px;display:flex;align-items:center;justify-content:space-between;">
      <nav style="display:flex;align-items:center;gap:28px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;">
        <a class="hovt1" href="#home" style="color:${homeActive?'var(--accent)':'var(--t2)'};display:flex;align-items:center;gap:7px;">${homeActive?'<span style="width:5px;height:5px;background:var(--accent);border-radius:50%;"></span>':''}${esc(t.navHome)}</a>
        <a class="hovt1" href="#publications" style="color:${pubsActive?'var(--accent)':'var(--t2)'};display:flex;align-items:center;gap:7px;">${pubsActive?'<span style="width:5px;height:5px;background:var(--accent);border-radius:50%;"></span>':''}${esc(t.navPubs)}</a>
      </nav>
      <div style="display:flex;align-items:center;gap:13px;">
        <!-- CV PDF button withdrawn 2026-10-31; original in claude-archive/2026-10-31/my-drluo/index.html.pre-pdf -->
        <button id="themeToggle" class="iconbtn" aria-label="theme" style="display:flex;align-items:center;justify-content:center;width:34px;height:31px;border:1px solid var(--line);border-radius:9px;background:transparent;cursor:pointer;color:var(--t2);">${themeIcon}</button>
        <button id="langToggle" style="display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:transparent;cursor:pointer;padding:0;font-family:'JetBrains Mono',monospace;"><span style="padding:7px 12px;font-size:11px;letter-spacing:.1em;background:${enBg};color:${enColor};">EN</span><span style="padding:7px 12px;font-size:11px;letter-spacing:.05em;background:${zhBg};color:${zhColor};font-family:'Noto Sans SC',sans-serif;">中</span></button>
      </div>
    </div>
  </div>`;
}
function render(){
  const D = data(lang);
  let view = st.route==='pubs' ? viewPubs(D) : st.route==='detail' ? viewDetail(D) : viewHome(D);
  return `<div style="position:relative;min-height:100vh;background:var(--bg);overflow-x:hidden;">
    <div style="position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 520px at 22% -8%, color-mix(in srgb,var(--accent) 10%,transparent), transparent 70%),radial-gradient(700px 600px at 100% 0%, rgba(120,140,255,.05), transparent 60%);"></div>
    <div style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(circle at 30% 0%, #000, transparent 75%);"></div>
    ${renderSidebar(D.t)}
    <main id="pg-main" style="position:relative;z-index:2;margin-left:340px;min-height:100vh;">
      ${topbar(D)}
      <div id="pg-content" style="padding:0 44px 80px;max-width:900px;margin:0 auto;">${view}</div>
    </main>
  </div>`;
}
function mount(){
  const D = data(lang);
  if(st.route==='detail'){ const raw=D.PAPERS.find(p=>p.id===st.pubId); document.title=(raw?raw.title:'Mingyu LUO')+' · Mingyu LUO'; }
  else document.title = (st.route==='pubs'?'Publications · ':'')+'Mingyu LUO';
  document.getElementById('app').innerHTML = render();
  document.getElementById('langToggle').onclick = ()=>{ lang=lang==='zh'?'en':'zh'; copied=false; mount(); };
  document.getElementById('themeToggle').onclick = ()=>{ theme=theme==='light'?'dark':'light'; try{localStorage.setItem('site_theme',theme);}catch(e){} applyTheme(theme); mount(); };
  const cb=document.getElementById('copyBtn');
  if(cb) cb.onclick = ()=>{ const raw=D.PAPERS.find(p=>p.id===st.pubId); try{navigator.clipboard.writeText(raw.bibtex);}catch(e){} copied=true; mount(); setTimeout(()=>{copied=false;mount();},1600); };
}
applyTheme(theme);
window.addEventListener('hashchange', ()=>{ st=parseHash(); copied=false; window.scrollTo(0,0); mount(); });
mount();
</script>
</body>
</html>
